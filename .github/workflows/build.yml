name: build-android-arm64

on:
  workflow_dispatch:
    inputs:
      version:
        description: "omp version to build (e.g. 18.1.19). Empty = latest upstream release."
        required: false
        default: ""
  schedule:
    # Poll for new upstream releases. The job exits after one API call when omp-<version>
    # already has a release, so the frequency costs nothing; GitHub may still delay
    # scheduled runs by a few minutes under load.
    - cron: "*/30 * * * *"
  push:
    tags: ["omp-*"]

permissions:
  contents: write            # needed to publish the release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the omp version to build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#omp-}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(gh api repos/can1357/oh-my-pi/releases/latest --jq .tag_name)"
            VERSION="${VERSION#v}"
          fi
          [ -n "$VERSION" ] || { echo "could not resolve an omp version" >&2; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "building pi-natives for omp $VERSION"

      # Before anything heavy: a poll for an already-released version must not download a toolchain.
      - name: Skip when that version is already published
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "omp-$VERSION" >/dev/null 2>&1; then
            echo "omp-$VERSION is already released — nothing to do"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: oven-sh/setup-bun@v2
        if: env.SKIP != '1'
        with:
          bun-version: 1

      - name: Show cross toolchain
        if: env.SKIP != '1'
        run: |
          rustup --version
          bun --version
          cmake --version | head -1
          # omp-termux picks the NDK up from ANDROID_NDK_ROOT / _HOME / _LATEST_HOME or the SDK itself.
          echo "NDK: ${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-unset}}}"

      - uses: actions/cache@v4
        if: env.SKIP != '1'
        with:
          path: |
            work/cargo-target
            work/napi-cli
            work/opus-24-arm64
            work/src
          key: omp-termux-${{ runner.os }}-${{ hashFiles('patches/*.patch') }}
          restore-keys: |
            omp-termux-${{ runner.os }}-

      - name: Cross-compile the addon
        if: env.SKIP != '1'
        run: ./bin/omp-termux build "$VERSION"

      # The addon has to match the omp version installed on the device, so every
      # upstream release gets its own release here: tag omp-<version>.
      - name: Publish release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="omp-$VERSION"
          FILES="out/pi_natives.android-arm64.node out/desktop-adapter.js"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" --title "pi-natives $VERSION (android-arm64)" \
              --notes "The Android aarch64 build of @oh-my-pi/pi-natives." \
              $FILES
          fi
